name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Back-end (Jakarta EE 11 / Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build + tests (dont SR-AUZ-01)
        run: mvn -B -f backend/pom.xml verify

  backend-sca:
    name: SCA Maven — OWASP Dependency-Check (SR-TST-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Analyse des dépendances (échec si CVSS ≥ 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B -f backend/pom.xml
          org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=7
          -DnvdApiKey=${NVD_API_KEY}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html

  frontend:
    name: Front-end (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: SCA npm (SR-TST-02)
        run: npm audit --audit-level=high
        working-directory: frontend

  secrets:
    name: Recherche de secrets (SR-TST-05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
